version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "9005:9005"
    volumes:
      - ~/.claude:/root/.claude:ro
      - ~/.claude_karma:/root/.claude_karma
    environment:
      - CLAUDE_KARMA_CLAUDE_BASE=/root/.claude
      - CLAUDE_KARMA_USE_SQLITE=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5199:5199"
    environment:
      - PUBLIC_API_URL=http://localhost:9005
      - INTERNAL_API_URL=http://api:9005
    depends_on:
      - api
    restart: unless-stopped
